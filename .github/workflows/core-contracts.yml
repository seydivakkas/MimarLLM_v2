name: Core contracts (synthetic, Linux + Windows)

on:
  push:
    paths:
      - "src/mimarllm/core/**"
      - "src/mimarllm/importers/**"
      - "src/mimarllm/ocr/**"
      - "src/mimarllm/geometry/**"
      - "src/mimarllm/rules/**"
      - "src/mimarllm/legal/**"
      - "src/mimarllm/rag/**"
      - "src/mimarllm/reports/**"
      - "src/mimarllm/pipeline.py"
      - "src/mimarllm/cli.py"
      - "src/mimarllm/app/**"
      - "scripts/windows/**"
      - "run.bat"
      - "install_offline.bat"
      - "build_exe.bat"
      - "mimar.spec"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/core-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test-only packages
        run: |
          python -m pip install --disable-pip-version-check -e . --no-deps
          python -m pip install --disable-pip-version-check "pydantic>=2,<3" "pytest>=8,<10" "pdfplumber>=0.11,<0.13" "pypdfium2>=4,<6" "reportlab>=4,<5" "ezdxf>=1.4,<2" "shapely>=2.0,<3" "networkx>=3.2,<4" "fastapi>=0.115,<1" "uvicorn>=0.30,<1" "httpx>=0.27,<1"
      - name: Validate drawing geometry legal and local hybrid RAG contracts
        run: python -m pytest -q tests/test_units.py tests/test_drawing_ir.py tests/test_pdf_contract.py tests/test_dxf_parser.py tests/test_pdf_ir.py tests/test_geometry.py tests/test_topology.py tests/test_rules.py tests/test_legal_etl.py tests/test_rag.py tests/test_rag_lexicon.py tests/test_legal_binding.py tests/test_legal_review.py tests/test_reports.py tests/test_pipeline.py tests/test_cli.py tests/test_dashboard.py tests/test_windows_packaging.py tests/test_repair.py tests/test_tiled_ocr.py
